<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JARVIS"><title>JARVIS</title><link rel="manifest" href="./manifest.webmanifest"><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 28%,#12395c,#07111f 60%);color:#e7faff;display:grid;place-items:center;padding:24px}.app{width:min(100%,480px);text-align:center}.orb{margin:25px auto;width:210px;height:210px;border-radius:50%;border:2px solid #3de7ff;box-shadow:0 0 30px #00cfff66,inset 0 0 50px #00cfff44;display:grid;place-items:center;font-size:46px;letter-spacing:4px}.orb.active{animation:pulse 1.2s infinite alternate}@keyframes pulse{to{box-shadow:0 0 65px #00cfff,inset 0 0 70px #00cfff88}}h1{letter-spacing:7px}p{color:#a4c7d9}button{border:1px solid #38cdec;border-radius:14px;padding:15px 20px;background:#123c56;color:white;font-size:16px;margin:5px;cursor:pointer}button:focus-visible{outline:3px solid white}#output{min-height:90px;padding:16px;border:1px solid #28546d;border-radius:14px;margin-top:20px;text-align:left;overflow-wrap:anywhere}.small{font-size:12px}</style></head><body><main class="app"><h1>JARVIS</h1><p>Private-first iPhone voice companion</p><div class="orb" id="orb" aria-hidden="true">J</div><button id="listen">🎙 Speak</button><button id="stop">Stop</button><button id="clear">Clear</button><div id="output" role="status" aria-live="polite">Ready. Voice recognition requires browser support and microphone permission.</div><p class="small">Hinglish commands • No cloud API keys • No background listening</p></main><script>
const out=document.getElementById('output'),orb=document.getElementById('orb');const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;function say(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=/[\u0900-\u097F]/.test(t)?'hi-IN':'en-IN';speechSynthesis.speak(u)}function respond(t){const q=t.toLowerCase();let a;if(/time|samay|kitne baje/.test(q))a='It is '+new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});else if(/date|tarikh|aaj kya din/.test(q))a='Today is '+new Date().toLocaleDateString('en-IN',{dateStyle:'full'});else if(/hello|hi|namaste|hey jarvis/.test(q))a='Hello! Main JARVIS hoon. How can I help?';else a='I heard: '+t+'. Advanced AI needs a secure backend connection; this demo does not send your speech to an AI service.';out.textContent='You: '+t+'\nJARVIS: '+a;say(a)}document.getElementById('listen').onclick=()=>{if(!Recognition){out.textContent='Speech recognition is not available in this browser. Try Safari or use a supported browser.';return}rec=new Recognition();rec.lang='en-IN';rec.interimResults=false;rec.onstart=()=>{orb.classList.add('active');out.textContent='Listening…'};rec.onresult=e=>respond(e.results[0][0].transcript);rec.onerror=e=>{out.textContent='Microphone error: '+e.error};rec.onend=()=>orb.classList.remove('active');try{rec.start()}catch(e){out.textContent='Could not start microphone: '+e.message}};document.getElementById('stop').onclick=()=>{rec?.stop();speechSynthesis?.cancel();orb.classList.remove('active')};document.getElementById('clear').onclick=()=>{out.textContent='Ready';speechSynthesis?.cancel()};</script></body></html>
